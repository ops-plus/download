[project]
name = "download"
version = "0.1.0"
description = "Download proxy server with Cloudflare bypass using curl_cffi and FastAPI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["fastapi[standard]>=0.100.0", "curl-cffi>=0.6.0"]

[project.scripts]
download-proxy = "download_proxy:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.hatch]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
[tool.hatch.build.targets.wheel]
